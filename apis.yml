aid: root-insurance
url: https://raw.githubusercontent.com/api-evangelist/root-insurance/refs/heads/main/apis.yml
name: Root Insurance
kind: company
description: >-
  Root is a U.S. app-first auto insurer that prices policies primarily on real
  driving behavior captured by smartphone telematics. The Root mobile app
  handles enrollment, telematics scoring, policy management, claims, and
  optional roadside assistance, with renters insurance as an add-on line. Root
  has reorganized its tech stack around APIs to power embedded auto insurance
  with partners such as Carvana and Hyundai Capital America; partner APIs are
  gated and not publicly documented. Note: Root Insurance (joinroot.com) is
  distinct from the unrelated Root Platform (rootplatform.com) insurtech in
  South Africa / UK.
